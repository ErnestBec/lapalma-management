spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${POSTGRES_DB:lapalma_db}
    username: ${POSTGRES_USER:lapalma_user}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.lapalma.management: DEBUG
    org.hibernate.SQL: DEBUG