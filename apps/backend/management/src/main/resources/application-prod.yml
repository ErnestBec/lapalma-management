spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: false
  web:
    error:
      include-message: never
      include-stacktrace: never

logging:
  level:
    root: INFO
    com.lapalma.management: INFO
    org.hibernate.SQL: WARN
